<div class="doc-page">
  <div class="doc-header">
    <div class="doc-heading">
      <h1 class="doc-title">Créer un document</h1>
      <p class="doc-subtitle">Envoyer un document à tous les employés</p>
    </div>
    <a class="btn btn-outline" routerLink="/directeur-dsn/evenements">Événements en attente</a>
  </div>

  <p class="alert" *ngIf="errorMsg">{{ errorMsg }}</p>
  <p class="alert alert-success" *ngIf="msg">{{ msg }}</p>

  <div class="card form-card">
    <form class="form-grid" [formGroup]="form" (ngSubmit)="submit()">
      <div class="row-fields">
        <div class="field">
          <label class="label">Titre du document *</label>
          <input class="input" formControlName="titre" placeholder="Ex: Décision DSN" autocomplete="off" />
        </div>

        <div class="field">
          <label class="label">Niveau accès (optionnel)</label>
          <input class="input" formControlName="niveauAcces" placeholder="Ex: Interne" autocomplete="off" />
        </div>
      </div>

      <div class="field file-field">
        <label class="label">Fichier *</label>
        <label class="upload-zone" for="dsn-file-input">
          <span class="upload-icon" aria-hidden="true">⇪</span>
          <div class="upload-text">
            <span class="upload-title">Choisir un fichier</span>
            <span class="upload-subtitle">PDF, DOCX, XLSX ou image</span>
          </div>
          <span class="upload-filename" *ngIf="selectedFile">{{ selectedFile.name }}</span>
        </label>
        <input
          id="dsn-file-input"
          class="file-input-native"
          type="file"
          accept=".pdf,.doc,.docx,.xls,.xlsx,.png,.jpg,.jpeg"
          (change)="onFileSelected($event)"
        />
      </div>

      <div class="actions">
        <button class="btn btn-primary" type="submit" [disabled]="loadingSend">
          {{ loadingSend ? 'Envoi...' : 'Envoyer document' }}
        </button>
      </div>
    </form>
  </div>
</div>
