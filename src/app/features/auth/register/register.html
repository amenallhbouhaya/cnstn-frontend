<div class="auth-split">
  <!-- Left panel -->
  <div class="auth-brand">
    <div class="brand-content">
      <img class="brand-logo" src="cnstn-logo.png" alt="CNSTN">
      <h1 class="brand-name">CNSTN</h1>
      <p class="brand-tagline">Centre National des Sciences et Technologies Nucléaires</p>
    </div>
    <div class="brand-decor"></div>
  </div>

  <!-- Right panel -->
  <div class="auth-panel">
    <div class="auth-card">
      <h2 class="auth-title">Créer un compte</h2>
      <p class="auth-subtitle">Remplissez vos informations pour vous inscrire.</p>

      <form class="form" [formGroup]="form" (ngSubmit)="submit()">
        <div class="form-grid">
          <div class="form-row">
            <label class="label" for="nom">Nom</label>
            <input class="input" id="nom" formControlName="nom" placeholder="Nom">
          </div>

          <div class="form-row">
            <label class="label" for="prenom">Prénom</label>
            <input class="input" id="prenom" formControlName="prenom" placeholder="Prénom">
          </div>
        </div>

        <div class="form-row">
          <label class="label" for="reg-email">Email</label>
          <input class="input" id="reg-email" type="email" formControlName="email" placeholder="ex: test&#64;mail.com">
        </div>

        <div class="form-row">
          <label class="label" for="reg-password">Mot de passe</label>
          <input class="input" id="reg-password" type="password" formControlName="password" placeholder="••••••••">
        </div>

        <div class="form-grid">
          <div class="form-row">
            <label class="label" for="matricule">Matricule</label>
            <input class="input" id="matricule" type="number" formControlName="matricule" placeholder="1234">
          </div>

          <div class="form-row">
            <label class="label" for="telephone">Téléphone</label>
            <input class="input" id="telephone" type="number" formControlName="telephone" placeholder="99 999 999">
          </div>
        </div>

        <button class="btn" type="submit">Créer mon compte</button>

        <p class="alert" *ngIf="errorMsg">{{ errorMsg }}</p>
        <p class="ok" *ngIf="successMsg">{{ successMsg }}</p>
      </form>

      <div class="auth-footer">
        Déjà un compte ? <a class="link" routerLink="/login">Se connecter</a>
      </div>
    </div>
  </div>
</div>
