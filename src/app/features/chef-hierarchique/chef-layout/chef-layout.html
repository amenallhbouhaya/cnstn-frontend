<div class="shell">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <img class="sidebar-logo" src="cnstn-logo.png" alt="CNSTN">
      <div class="sidebar-brand-text">
        <span class="sidebar-title">CNSTN</span>
        <span class="sidebar-role">Chef Hiérarchique</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a class="nav-link" routerLink="/chef-hierarchique" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Dashboard</span>
      </a>

      <a class="nav-link" routerLink="/chef-hierarchique/comptes-en-attente" routerLinkActive="active">
        <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>Comptes en attente</span>
      </a>

      <a class="nav-link" routerLink="/chef-hierarchique/compte" routerLinkActive="active">
        <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Mon compte</span>
      </a>

      <a class="nav-link" routerLink="/chef-hierarchique/notifications" routerLinkActive="active">
        <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span>Notifications</span>
        <span class="badge" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
      </a>
    </nav>

    <button class="sidebar-logout" (click)="logout()">
      <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      <span>Déconnexion</span>
    </button>
  </aside>

  <!-- Main content -->
  <section class="main">
    <header class="topbar">
      <div>
        <strong>Espace Chef Hiérarchique</strong>
        <p>Suivi hiérarchique et validation</p>
      </div>
    </header>

    <div class="page">
      <router-outlet></router-outlet>
    </div>
  </section>
</div>
