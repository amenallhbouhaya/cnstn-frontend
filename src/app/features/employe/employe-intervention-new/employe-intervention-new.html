<div class="emp-page">
  <div class="emp-header">
    <div>
      <h1 class="emp-title">Demande d'intervention</h1>
      <p class="emp-subtitle">Signalez un problème technique</p>
    </div>
    <a class="btn btn--outline" routerLink="/employe/interventions">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Mes demandes
    </a>
  </div>

  <div class="alert alert--success" *ngIf="msg">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
    {{ msg }}
  </div>
  <div class="alert alert--error" *ngIf="errorMsg">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
    {{ errorMsg }}
  </div>

  <div class="form-card">
    <form class="form-grid" [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label class="field__label">Description du problème</label>
        <input class="field__input" formControlName="description" placeholder="Décrivez le problème rencontré...">
      </div>

      <div class="field">
        <label class="field__label">Équipements concernés (optionnel)</label>
        <div class="checkbox-grid">
          <label *ngFor="let e of equipements" class="checkbox-label">
            <input type="checkbox" (change)="toggle(e.id, $any($event.target).checked)">
            <span>{{ e.typeEquipement }} — {{ e.etat }}</span>
          </label>
        </div>
      </div>

      <div class="form-actions">
        <button class="btn btn--primary" type="submit" [disabled]="loading">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          {{ loading ? 'Envoi...' : 'Envoyer la demande' }}
        </button>
      </div>
    </form>
  </div>
</div>
