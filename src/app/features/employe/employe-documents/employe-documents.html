<div class="emp-page">
  <div class="emp-header">
    <div>
      <h1 class="emp-title">Documents</h1>
      <p class="emp-subtitle">Consultez et téléchargez vos documents</p>
    </div>
  </div>

  <div class="alert alert--error" *ngIf="errorMsg">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
    {{ errorMsg }}
  </div>

  <div class="alert alert--success new-doc-alert" *ngIf="!loading && newDocsCount > 0">
    <span>📩 {{ newDocsCount }} nouveau(x) document(s)</span>
    <button class="btn-link" type="button" (click)="markAllAsRead()">Marquer comme lu</button>
  </div>

  <div class="emp-loading" *ngIf="loading">
    <div class="spinner"></div>
    <span>Chargement…</span>
  </div>

  <div class="card" *ngIf="!loading">
    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th>Titre</th>
            <th>Type</th>
            <th>Accès</th>
            <th class="text-right">Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let d of items">
            <td>
              <div class="cell-main">
                {{ d.titre }}
                <span class="new-badge" *ngIf="isNew(d.id)">Nouveau</span>
              </div>
            </td>
            <td><span class="badge">{{ d.type }}</span></td>
            <td><span class="badge badge--outline">{{ d.niveauAcces }}</span></td>
            <td class="text-right">
              <button class="btn btn--sm btn--primary" (click)="download(d)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                Télécharger
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="empty-state" *ngIf="items.length === 0">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      <p>Aucun document disponible.</p>
    </div>
  </div>
</div>
