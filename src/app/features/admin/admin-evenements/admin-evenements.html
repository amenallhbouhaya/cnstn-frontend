<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <img class="auth-logo" src="cnstn-logo.png" alt="CNSTN">
      <h2 class="auth-title">Gestion des Evénements</h2>
    </div>

    <div class="toolbar">
      <button class="btn btn--primary" type="button" (click)="newItem()">+ Nouvel événement</button>
    </div>

    <form class="form" [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-row">
        <div class="label">Nom (optionnel)</div>
        <input class="input" formControlName="nom">
      </div>

      <div class="form-row">
        <div class="label">Titre</div>
        <input class="input" formControlName="titre">
      </div>

      <div class="form-row">
        <div class="label">Description</div>
        <input class="input" formControlName="description">
      </div>

      <div class="form-row">
        <div class="label">Date début</div>
        <input class="input" type="datetime-local" formControlName="dateDebut">
      </div>

      <div class="form-row">
        <div class="label">Date fin</div>
        <input class="input" type="datetime-local" formControlName="dateFin">
      </div>

      <div class="form-row">
        <div class="label">Type</div>
        <select class="input" formControlName="typeEvenement">
          <option [ngValue]="null">-- choisir --</option>
          <option *ngFor="let t of typeValues" [ngValue]="t">{{ t }}</option>
        </select>
      </div>

      <button class="btn btn--primary" type="submit">
        {{ editingId === null ? 'Ajouter' : 'Enregistrer' }}
      </button>

      <p class="alert" *ngIf="errorMsg">{{ errorMsg }}</p>
    </form>

    <hr class="divider" />

    <p class="loading" *ngIf="loading">Chargement...</p>

    <div class="table-wrap" *ngIf="!loading">
      <table>
        <thead>
          <tr>
            <th>Titre</th>
            <th>Type</th>
            <th>Début</th>
            <th>Fin</th>
            <th class="actions">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let e of items">
            <td>{{ e.titre }}</td>
            <td>{{ e.typeEvenement }}</td>
            <td>{{ e.dateDebut | date:'yyyy-MM-dd HH:mm' }}</td>
            <td>{{ e.dateFin | date:'yyyy-MM-dd HH:mm' }}</td>
            <td class="actions">
              <div class="actions-group">
                <button class="btn" type="button" (click)="edit(e)">Edit</button>
                <button class="btn btn--danger" type="button" (click)="remove(e.id)">Delete</button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
