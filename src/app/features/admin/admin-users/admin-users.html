<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <img class="auth-logo" src="cnstn-logo.png" alt="CNSTN">
      <h2 class="auth-title">Gestion des Utilisateurs</h2>
    </div>

    <p class="alert" *ngIf="errorMsg">{{ errorMsg }}</p>

    <div class="toolbar">
      <input class="input" placeholder="Nouveau role (ex: ChefProjet)" [(ngModel)]="newRole" />
      <button class="btn btn--primary" type="button" (click)="addRole()">Ajouter role</button>
    </div>

    <p class="loading" *ngIf="loading">Chargement...</p>

    <div class="table-wrap" *ngIf="!loading">
      <table>
        <thead>
          <tr>
            <th>Nom</th>
            <th>Email</th>
            <th>Matricule</th>
            <th>Role</th>
            <th>Changer</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let u of users">
            <td>{{ u.nom }} {{ u.prenom }}</td>
            <td>{{ u.email }}</td>
            <td>{{ u.matricule }}</td>
            <td>{{ u.role }}</td>
            <td>
              <select class="input" [value]="u.role" (change)="changeRole(u, $any($event.target).value)">
                <option *ngFor="let r of roles" [value]="r">{{ r }}</option>
              </select>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
