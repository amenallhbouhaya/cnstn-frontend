<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <img class="auth-logo" src="cnstn-logo.png" alt="CNSTN">
      <h2 class="auth-title">Gestion des Equipements</h2>
    </div>

    <form class="form" [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-row">
        <div class="label">Nom</div>
        <input class="input" formControlName="nom" placeholder="Nom de l'equipement">
      </div>

      <div class="form-row">
        <div class="label">Numero de serie</div>
        <input class="input" formControlName="numeroSerie" placeholder="Ex: 2020">
      </div>

      <button class="btn btn--primary" type="submit">
        {{ editingId === null ? 'Ajouter' : 'Enregistrer' }}
      </button>

      <p class="alert" *ngIf="errorMsg">{{ errorMsg }}</p>
    </form>

    <hr class="divider" />

    <p class="loading" *ngIf="loading">Chargement...</p>

    <div class="table-wrap" *ngIf="!loading">
      <table>
        <thead>
          <tr>
            <th>Nom</th>
            <th>Serie</th>
            <th>Etat</th>
            <th>Reservable</th>
            <th>Date</th>
            <th class="actions">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let e of items">
            <td>{{ e.nom || '-' }}</td>
            <td>{{ e.numeroSerie || '-' }}</td>
            <td>{{ e.etat }}</td>
            <td>{{ e.reservable ? 'Oui' : 'Non' }}</td>
            <td>{{ e.dateAquisation | date:'yyyy-MM-dd' }}</td>
            <td class="actions">
              <div class="actions-group">
                <button class="btn" type="button" (click)="edit(e)">Edit</button>
                <button class="btn btn--danger" type="button" (click)="remove(e.id)">Delete</button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
