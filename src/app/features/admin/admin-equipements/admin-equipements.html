<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <img class="auth-logo" src="cnstn-logo.png" alt="CNSTN">
      <h2 class="auth-title">Gestion des Equipements</h2>
    </div>

    <div class="toolbar">
      <button class="btn btn--primary" type="button" (click)="newItem()">+ Nouvel équipement</button>
    </div>

    <form class="form" [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-row">
        <div class="label">Date d'acquisition</div>
        <input class="input" type="date" formControlName="dateAquisation">
      </div>

      <div class="form-row">
        <div class="label">Etat</div>
        <input class="input" formControlName="etat" placeholder="Bon / En panne ...">
      </div>

      <div class="form-row">
        <div class="label">Reservable</div>
        <input type="checkbox" formControlName="reservable">
      </div>

      <div class="form-row">
        <div class="label">Type</div>
        <select class="input" formControlName="typeEquipement">
          <option [ngValue]="null">-- choisir --</option>
          <option *ngFor="let t of typeValues" [ngValue]="t">{{ t }}</option>
        </select>
      </div>

      <button class="btn btn--primary" type="submit">
        {{ editingId === null ? 'Ajouter' : 'Enregistrer' }}
      </button>

      <p class="alert" *ngIf="errorMsg">{{ errorMsg }}</p>
    </form>

    <hr class="divider" />

    <p class="loading" *ngIf="loading">Chargement...</p>

    <div class="table-wrap" *ngIf="!loading">
      <table>
        <thead>
          <tr>
            <th>Type</th>
            <th>Etat</th>
            <th>Reservable</th>
            <th>Date</th>
            <th class="actions">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let e of items">
            <td>{{ e.typeEquipement }}</td>
            <td>{{ e.etat }}</td>
            <td>{{ e.reservable ? 'Oui' : 'Non' }}</td>
            <td>{{ e.dateAquisation | date:'yyyy-MM-dd' }}</td>
            <td class="actions">
              <div class="actions-group">
                <button class="btn" type="button" (click)="edit(e)">Edit</button>
                <button class="btn btn--danger" type="button" (click)="remove(e.id)">Delete</button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
