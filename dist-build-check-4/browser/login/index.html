<style>:root{--bg: #f0f2f8;--card: #ffffff;--text: #1a1f36;--muted: #5a6178;--border: #dfe3ec;--primary: #1b2a6b;--primary-2: #142057;--primary-light: rgba(27,42,107,.08);--accent-red: #cc2222;--accent-red-2: #a81c1c;--accent-green: #2e7d32;--danger: #cc2222;--shadow: 0 18px 50px rgba(27,42,107,.08);--radius: 16px}*{box-sizing:border-box}html,body{height:100%}body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,Noto Sans,Helvetica Neue,sans-serif;background:radial-gradient(1200px 600px at 10% 10%,rgba(27,42,107,.07),transparent 60%),radial-gradient(900px 500px at 90% 20%,rgba(204,34,34,.05),transparent 55%),var(--bg);color:var(--text)}.auth-split{display:flex;min-height:100vh}.auth-brand{position:relative;width:44%;min-width:360px;background:linear-gradient(160deg,#1b2a6b,#142057 55%,#0f1740);display:flex;align-items:center;justify-content:center;overflow:hidden}.brand-content{position:relative;z-index:2;text-align:center;color:#fff;padding:40px}.brand-logo{width:100px;height:100px;object-fit:contain;background:#fffffff2;border-radius:22px;padding:10px;box-shadow:0 12px 40px #0003;margin-bottom:24px}.brand-name{margin:0 0 10px;font-size:36px;font-weight:800;letter-spacing:3px}.brand-tagline{margin:0;font-size:14px;color:#ffffffa6;line-height:1.6;max-width:280px;margin-inline:auto}.brand-decor{position:absolute;inset:0;pointer-events:none}.brand-decor:before,.brand-decor:after{content:"";position:absolute;border-radius:50%}.brand-decor:before{width:340px;height:340px;top:-80px;left:-100px;background:#cc22221f}.brand-decor:after{width:260px;height:260px;bottom:-60px;right:-80px;background:#2e7d321a}.auth-panel{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 24px;background:var(--bg)}.auth-panel .auth-card{width:min(440px,100%);border:none;box-shadow:none;background:transparent;padding:0}.auth-panel .auth-title{font-size:26px;font-weight:800;color:var(--primary);margin:0 0 4px}.auth-panel .auth-subtitle{margin:0 0 24px;font-size:15px}.auth-panel .form{gap:16px}.auth-panel .form-row{gap:6px}.auth-panel .label{font-size:13px;font-weight:600;color:var(--text)}.auth-panel .input{padding:12px 14px;border-radius:12px;border:1.5px solid var(--border);background:#fff;font-size:15px;transition:border-color .15s,box-shadow .15s}.auth-panel .input:focus{border-color:var(--primary);box-shadow:0 0 0 4px #1b2a6b14}.auth-panel .btn{margin-top:4px;padding:13px 14px;font-size:15px;border-radius:12px;background:var(--primary);letter-spacing:.3px}.auth-panel .btn:hover{background:var(--primary-2)}.auth-panel .auth-footer{margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}@media(max-width:768px){.auth-split{flex-direction:column}.auth-brand{width:100%;min-width:unset;min-height:220px}.brand-logo{width:64px;height:64px;border-radius:16px;padding:6px;margin-bottom:14px}.brand-name{font-size:24px}.brand-tagline{font-size:12px}.auth-panel{padding:28px 16px}}.auth-card{width:min(460px,100%);background:var(--card);border:1px solid rgba(229,231,235,.9);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px}.auth-title{margin:0;font-size:22px;font-weight:700;letter-spacing:.2px}.auth-subtitle{margin:0 0 18px;color:var(--muted);font-size:14px}.form{display:grid;gap:12px}.form-row{display:grid;gap:8px}.label{font-size:13px;color:#334155}.input{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--border);background:#fff;outline:none;transition:box-shadow .15s,border-color .15s}.input:focus{border-color:#1b2a6ba6;box-shadow:0 0 0 4px #1b2a6b1a}.btn{width:100%;padding:11px 12px;border:0;border-radius:12px;background:var(--primary);color:#fff;font-weight:650;cursor:pointer;transition:background .15s,transform .05s}.btn:hover{background:var(--primary-2)}.btn:active{transform:translateY(1px)}.auth-footer{margin-top:14px;font-size:14px;color:var(--muted);text-align:center}.link{color:var(--primary);text-decoration:none;font-weight:600}.link:hover{text-decoration:underline}
</style><link rel="stylesheet" href="styles-VMY3PE2B.css" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="styles-VMY3PE2B.css"></noscript></head>
